name: Publish scientific run reports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - _quarto.yml
      - index.md
      - reports/**
      - docs/reporting.md
      - docs/mini_millennium_equivalence.md
      - docs/conservation.md
      - docs/numerical_integration.md
      - docs/sensitivity.md
      - docs/performance.md
      - docs/mimic_jax_scientific_program.md
      - plot/mimic-plot/README.md
      - scripts/check_reports.py
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate committed report artifacts
        run: python3 scripts/check_reports.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render static site
        run: quarto render

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
