project:
  type: website
  output-dir: _site
  render:
    - index.md
    - reports/*/index.md
    - docs/reporting.md
    - docs/mini_millennium_equivalence.md
    - docs/conservation.md
    - docs/sage16_hybrid_system.md
    - docs/numerical_integration.md
    - docs/sensitivity.md
    - docs/differentiable_calibration.md
    - docs/performance.md
    - docs/mimic_jax_scientific_program.md
    - docs/shark_lagos23.md
    - docs/sapphire_interoperability.md
    - docs/model_comparison.md
    - plot/mimic-plot/README.md
  resources:
    - reports/**/*.json
    - reports/**/assets/**

website:
  title: "mimic-jax reports"
  site-url: https://yipihey.github.io/mimic-jax/
  repo-url: https://github.com/yipihey/mimic-jax
  repo-actions: [source, issue]
  navbar:
    left:
      - href: index.md
        text: Reports
      - href: docs/reporting.md
        text: Report design
      - href: docs/mini_millennium_equivalence.md
        text: Equivalence
      - href: docs/sensitivity.md
        text: Fractional responses
      - href: docs/numerical_integration.md
        text: Numerics
      - href: reports/sage16-linear-response/index.md
        text: Galaxy response
      - href: reports/sage16-differentiable-calibration/index.md
        text: Fit SAGE
      - href: reports/sage16-minimal-model/index.md
        text: Minimal SAGE
      - href: reports/shark-continuous-foundation/index.md
        text: SHARK Lagos23
      - href: reports/sage16-shark-interoperability-audit/index.md
        text: Compare models
      - href: reports/sage16-shark-response-foundation/index.md
        text: Compare responses
      - href: reports/three-model-response-foundation/index.md
        text: Three-model response
      - href: docs/shark_lagos23.md
        text: SHARK guide
      - href: docs/sapphire_interoperability.md
        text: Sapphire guide
      - href: docs/sage16_hybrid_system.md
        text: Hybrid SAGE16
  page-footer:
    left: "Faithful, differentiable SAM diagnostics"
    right: "Built from durable Markdown reports"

execute:
  enabled: false

format:
  html:
    theme: cosmo
    css: reports/styles.css
    toc: true
    code-copy: true
    link-external-newwindow: true
